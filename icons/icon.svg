<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#0d0f12"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#gymGrad)" stroke-width="6" opacity="0.4"/>
  <!-- Stylized Dumbbell / Energy Spark -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#glow)">
    <!-- Central bar -->
    <rect x="190" y="238" width="132" height="36" rx="10" fill="#e2e8f0"/>
    <!-- Left outer plate -->
    <rect x="120" y="176" width="28" height="160" rx="12" fill="url(#gymGrad)"/>
    <!-- Left inner plate -->
    <rect x="156" y="196" width="24" height="120" rx="10" fill="#f97316"/>
    <!-- Left collar -->
    <rect x="182" y="226" width="12" height="60" rx="4" fill="#64748b"/>
    <!-- Right outer plate -->
    <rect x="364" y="176" width="28" height="160" rx="12" fill="url(#gymGrad)"/>
    <!-- Right inner plate -->
    <rect x="332" y="196" width="24" height="120" rx="10" fill="#ef4444"/>
    <!-- Right collar -->
    <rect x="318" y="226" width="12" height="60" rx="4" fill="#64748b"/>
  </g>
  <!-- Flame / dynamic arc -->
  <path d="M 220 120 Q 256 90 292 120" stroke="#f97316" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="80" r="12" fill="#ef4444"/>
</svg>
