<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MIYU - Start Strong, Finish Recovered</title>
  
  <!-- Configuración PWA e iOS Safari -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MIYU">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  
  <!-- Tipografías exactas de Figma: Anton y Antonio -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Antonio:wght@300;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>

  <!-- ======================================================== -->
  <!-- PANTALLA 1: WELCOME SCREEN (Figma Frame 1:3480)          -->
  <!-- ======================================================== -->
  <section id="screenWelcome" class="screen screen-welcome active">
    
    <!-- Parte Superior: Header y Títulos -->
    <div class="welcome-top-content">
      <!-- Header Brand (Figma 319:4 y 319:5) -->
      <div class="welcome-top-brand">
        <img src="assets/miyu/miyu-icon.svg" class="welcome-top-icon" alt="Miyu Icon">
        <span class="welcome-top-text">MIYU</span>
      </div>

      <!-- Hero Titles (Figma 1:3493 y 1:3499) -->
      <div class="welcome-titles">
        <h1 class="welcome-main-heading">Welcome<br>to Miyu</h1>
        <p class="welcome-sub-heading">Explore the app, Start strong, finish recovered.</p>
      </div>
    </div>

    <!-- Parte Inferior Unificada (Domo + Monstruo + Botón sin cortes ni líneas negras) -->
    <div class="welcome-lower-block">
      <!-- Fondo continuo integrado: Arcos Púrpuras + Base Sólida en un solo SVG -->
      <svg class="unified-purple-bg" viewBox="0 0 414 540" preserveAspectRatio="none">
        <!-- Elipses concéntricas de Figma (1:3494 a 1:3500) -->
        <ellipse cx="207" cy="240" rx="250" ry="240" fill="#502bd6" />
        <ellipse cx="207" cy="240" rx="215" ry="206" fill="#6440e2" />
        <ellipse cx="207" cy="240" rx="180" ry="172" fill="#7654ed" />
        <ellipse cx="207" cy="240" rx="145" ry="138" fill="#8464fc" />
        <!-- Base sólida que baja hasta el fondo (Figma 1:3501) -->
        <rect x="0" y="235" width="414" height="305" fill="#8464fc" />
      </svg>

      <!-- Monstruo Miyu Oficial colocado en su posición exacta de Figma -->
      <div class="welcome-monster-layer">
        <img src="assets/miyu/miyu-welcome.svg" class="welcome-monster-img" alt="Miyu Monster">
      </div>

      <!-- Dock del Botón GET STARTED integrado sobre el fondo púrpura -->
      <div class="welcome-btn-dock">
        <button id="btnGetStarted" class="btn-figma-started">
          GET STARTED
        </button>
        <div class="iphone-home-bar"></div>
      </div>
    </div>
  </section>


  <!-- ======================================================== -->
  <!-- PANTALLA 2: CHOOSE TOPIC / CATALOG (Figma Node 1:1608)   -->
  <!-- ======================================================== -->
  <section id="screenChooseTopic" class="screen screen-choose-topic">
    <div class="topic-header">
      <div class="top-nav-bar">
        <button id="btnBackToWelcome" class="btn-icon-back" title="Volver al inicio">←</button>
        <div class="top-brand">
          <img src="assets/miyu/miyu-icon.svg" class="top-brand-icon" alt="Miyu Icon">
          <span class="top-brand-text">Miyu</span>
        </div>
        <button id="btnSettings" class="btn-icon-settings" title="Ajustes">⚙️</button>
      </div>

      <h1 class="topic-main-title">What are you<br>training today?</h1>
      <p class="topic-subtitle">Select your workout day:</p>
    </div>

    <!-- Masonry Grid: 6 Grupos Musculares (Exacto de Figma) -->
    <div class="masonry-grid" id="masonryContainer">
      <!-- Columna Izquierda -->
      <div class="masonry-col">
        <div class="workout-card card-leg" data-group-id="piernas">
          <div class="card-art-area">
            <img src="assets/topics/leg.svg" class="card-art-img" alt="Leg Day">
          </div>
          <div class="card-footer">
            <h3 class="card-title">Leg Day</h3>
            <span class="card-count">30 ejercicios</span>
          </div>
        </div>

        <div class="workout-card card-chest" data-group-id="pecho">
          <div class="card-art-area">
            <img src="assets/topics/chest.svg" class="card-art-img" alt="Chest Day">
          </div>
          <div class="card-footer">
            <h3 class="card-title">Chest Day</h3>
            <span class="card-count">30 ejercicios</span>
          </div>
        </div>

        <div class="workout-card card-abs" data-group-id="abdomen">
          <div class="card-art-area">
            <img src="assets/topics/abs.svg" class="card-art-img" alt="Abs Day">
          </div>
          <div class="card-footer">
            <h3 class="card-title">Abs Day</h3>
            <span class="card-count">30 ejercicios</span>
          </div>
        </div>
      </div>

      <!-- Columna Derecha -->
      <div class="masonry-col">
        <div class="workout-card card-arm" data-group-id="brazos">
          <div class="card-art-area">
            <img src="assets/topics/arm.svg" class="card-art-img" alt="Arm Day">
          </div>
          <div class="card-footer">
            <h3 class="card-title">Arm Day</h3>
            <span class="card-count">30 ejercicios</span>
          </div>
        </div>

        <div class="workout-card card-back" data-group-id="espalda">
          <div class="card-art-area">
            <img src="assets/topics/back.svg" class="card-art-img" alt="Back Day">
          </div>
          <div class="card-footer">
            <h3 class="card-title">Back Day</h3>
            <span class="card-count">30 ejercicios</span>
          </div>
        </div>

        <div class="workout-card card-cardio" data-group-id="cardio">
          <div class="card-art-area">
            <img src="assets/topics/cardio.svg" class="card-art-img" alt="Cardio Day">
          </div>
          <div class="card-footer">
            <h3 class="card-title">Cardio Day</h3>
            <span class="card-count">30 ejercicios</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-safe-space"></div>
  </section>

  <!-- Scripts principales -->
  <script defer src="app.js"></script>
</body>
</html>
